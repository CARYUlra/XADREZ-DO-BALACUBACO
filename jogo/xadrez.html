<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Xadrez Completo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c2c2c;
            color: #fff;
            margin-top: 40px;
            position: relative;
        }

        h1 { margin-bottom: 5px; }

        #status {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: #4caf50;
        }

        .check-alert {
            color: #ff5252 !important;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 4px solid #4a3625;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .square {
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            /* Prefer symbol fonts that render filled chess glyphs */
            font-family: 'Segoe UI Symbol', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }

        #board.board-skin-ice .light { background: #d3eafc; }
        #board.board-skin-ice .dark { background: #77b5e5; }
        #board.board-skin-wood .light { background: #e2c18a; }
        #board.board-skin-wood .dark { background: #8f6237; }
        #board.board-skin-night .light { background: #4e5878; }
        #board.board-skin-night .dark { background: #212747; }

        .piece-white {
            color: #ffffff;
            text-shadow: 
                -2px -2px 0 #000,  
                2px -2px 0 #000,
                -2px  2px 0 #000,
                2px  2px 0 #000,
                0px  4px 4px rgba(0,0,0,0.6);
        }

        .piece-black {
            color: #000000;
            text-shadow: 0px 4px 4px rgba(0,0,0,0.6);
        }

        .piece-skin-classic {
            /* Classic skin uses the default piece color and shadows defined by .piece-white/.piece-black */
            --ps-classic: 1;
        }

        .piece-skin-fancy {
            color: transparent !important;
            text-shadow:
                -1px -1px 0 currentColor,
                1px -1px 0 currentColor,
                -1px 1px 0 currentColor,
                1px 1px 0 currentColor,
                -2px 0 0 currentColor,
                2px 0 0 currentColor,
                0 -2px 0 currentColor,
                0 2px 0 currentColor;
        }

        .piece-skin-solid {
            /* Ensure solid skin shows fully filled glyphs with no transparency */
            color: inherit !important;
            -webkit-text-fill-color: inherit !important;
            -webkit-text-stroke: 0 !important;
            text-shadow: none !important;
            opacity: 1 !important;
        }

        /* Explicitly set colors for white/black pieces when solid skin is active */
        .piece-skin-solid.piece-white {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            font-weight: 700 !important;
            text-shadow: none !important;
        }
        .piece-skin-solid.piece-black {
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            font-weight: 700 !important;
            text-shadow: none !important;
        }

        .selected {
            background-color: #7b61ff !important;
        }

        .highlight::after {
            content: '';
            width: 25px;
            height: 25px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: absolute;
        }

        .highlight-capture {
            background-color: rgba(255, 82, 82, 0.6) !important;
        }

        /* --- Estilos do Menu de Promoção --- */
        #promotion-modal {
            display: none; /* Escondido por padrão */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #f0d9b5;
            padding: 20px;
            border-radius: 10px;
            border: 4px solid #4a3625;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            text-align: center;
            color: #000;
        }

        /* Modal de seleção de tempo e modo */
        #mode-modal, #time-modal {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            z-index: 120;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .mode-btn {
            background: #7b61ff;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Alertas de XEQUE (top e bottom) */
        .check-overlay {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 82, 82, 0.85);
            color: #fff;
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 28px;
            font-weight: 700;
            display: none;
            z-index: 200;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0.95;
        }

        .check-overlay.top {
            top: 8%;
        }

        .check-overlay.bottom {
            bottom: 8%;
        }

        @keyframes pulseFlash {
            0% { opacity: 0.95; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.06); }
            100% { opacity: 0.95; transform: translate(-50%, -50%) scale(1); }
        }

        .flash {
            animation: pulseFlash 1s infinite ease-in-out;
        }

        #promotion-modal h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .promo-options {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .promo-btn {
            font-size: 40px;
            width: 60px;
            height: 60px;
            cursor: pointer;
            background-color: #fff;
            border: 2px solid #000;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }

        .promo-btn:hover {
            background-color: #7b61ff;
            color: #fff;
        }

        #layout-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        #captured-white,
        #captured-black {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            max-width: 130px;
        }

        .captured-title {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .captured-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.16);
            border-radius: 10px;
            padding: 10px;
            min-height: 100px;
            width: 120px;
        }

        .side-timer {
            margin-top: 8px;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
            min-width: 100px;
        }

        .white-side-timer {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .black-side-timer {
            background: #000000;
            color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .captured-piece {
            font-size: 28px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: rgba(0,0,0,0.15);
        }

        #result-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.95);
            color: #fff;
            padding: 26px 30px;
            border-radius: 16px;
            border: 4px solid #7b61ff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            z-index: 210;
            text-align: center;
            width: 320px;
        }

        #result-modal h2 {
            margin: 0 0 16px;
            font-size: 1.6rem;
        }

        #result-modal button {
            background: #7b61ff;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        #timer {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #ffeb3b;
            font-weight: bold;
        }

        #skins-panel {
            width: 680px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 16px;
        }

        .skins-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .skin-tab {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .skin-tab.active,
        .skin-tab:hover {
            background: #7b61ff;
        }

        .skin-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .skin-option {
            flex: 1 1 160px;
            min-width: 160px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 14px;
            background: rgba(0,0,0,0.15);
            cursor: pointer;
            text-align: center;
            transition: border-color 0.2s, transform 0.2s;
        }

        .skin-option:hover,
        .skin-option.selected {
            border-color: #7b61ff;
            transform: translateY(-2px);
        }

        .skin-option-title {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .skin-preview {
            font-size: 30px;
            line-height: 1.1;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Xadrez Avançado</h1>
    <div id="status">Vez das Brancas</div>
    <div id="timer">Tempo: —</div>
    <div id="skins-panel">
        <div class="skins-tabs">
            <button class="skin-tab active" data-tab="pieces">Peças</button>
            <button class="skin-tab" data-tab="board">Tabuleiro</button>
        </div>
        <div id="pieces-skin-options" class="skin-options">
            <div class="skin-option selected" data-skin="classic">
                <div class="skin-option-title">Clássico</div>
                <div class="skin-preview">♔ ♕ ♖ ♗ ♘ ♙</div>
            </div>
            <div class="skin-option" data-skin="simple">
                <div class="skin-option-title">Simples</div>
                <div class="skin-preview">K Q R B N P</div>
            </div>
            <div class="skin-option" data-skin="solid">
                <div class="skin-option-title">Sólido</div>
                <div class="skin-preview">⬤ ⬤ ⬤ ⬤ ⬤ ⬤</div>
            </div>
        </div>
        <div id="board-skin-options" class="skin-options hidden">
            <div class="skin-option selected" data-skin="classic">
                <div class="skin-option-title">Clássico</div>
                <div class="skin-preview">🟧 🟫</div>
            </div>
            <div class="skin-option" data-skin="ice">
                <div class="skin-option-title">Gelo</div>
                <div class="skin-preview">❄️ ⬜</div>
            </div>
            <div class="skin-option" data-skin="wood">
                <div class="skin-option-title">Madeira</div>
                <div class="skin-preview">🌲 🪵</div>
            </div>
            <div class="skin-option" data-skin="night">
                <div class="skin-option-title">Noite</div>
                <div class="skin-preview">🌑 ⭐</div>
            </div>
        </div>
    </div>
    <div id="layout-wrapper">
        <div id="captured-white">
            <div class="captured-title">Peças Brancas Capturadas</div>
            <div class="captured-list" id="captured-white-list"></div>
            <div id="white-side-timer" class="side-timer white-side-timer">--:--</div>
        </div>
        <div id="board"></div>
        <div id="captured-black">
            <div class="captured-title">Peças Pretas Capturadas</div>
            <div class="captured-list" id="captured-black-list"></div>
            <div id="black-side-timer" class="side-timer black-side-timer">--:--</div>
        </div>
    </div>

    <div id="promotion-modal">
        <h3>Escolha a promoção:</h3>
        <div class="promo-options">
            <button class="promo-btn piece-black" onclick="promotePiece('q')">♛</button>
            <button class="promo-btn piece-black" onclick="promotePiece('r')">♜</button>
            <button class="promo-btn piece-black" onclick="promotePiece('b')">♝</button>
            <button class="promo-btn piece-black" onclick="promotePiece('n')">♞</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <script>
        const game = new Chess();
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const timerEl = document.getElementById('timer');
        const whiteSideTimerEl = document.getElementById('white-side-timer');
        const blackSideTimerEl = document.getElementById('black-side-timer');
        const promotionModal = document.getElementById('promotion-modal');

        // Novo: modal de seleção de tempo, modo e overlay de XEQUE
        const timeModal = document.createElement('div');
        timeModal.id = 'time-modal';
        timeModal.innerHTML = `<span>Escolha o tempo:</span><button class="mode-btn" onclick="chooseTime('bullet')">Bullet 3'</button><button class="mode-btn" onclick="chooseTime('blitz')">Blitz 5'</button><button class="mode-btn" onclick="chooseTime('normal')">Normal 10'</button><button class="mode-btn" onclick="chooseTime('beginner')">Beginner 15'</button><button class="mode-btn" onclick="chooseTime('sandbox')">Sandbox ∞</button>`;
        document.body.appendChild(timeModal);

        const modeModal = document.createElement('div');
        modeModal.id = 'mode-modal';
        modeModal.style.display = 'none';
        modeModal.innerHTML = `<span>Escolher modo:</span><button class="mode-btn" onclick="chooseMode('bot-w')">Bot Brancas</button><button class="mode-btn" onclick="chooseMode('bot-b')">Bot Pretas</button><button class="mode-btn" onclick="chooseMode('1v1')">1v1</button>`;
        document.body.appendChild(modeModal);

        const checkOverlayTop = document.createElement('div');
        checkOverlayTop.className = 'check-overlay top';
        checkOverlayTop.innerText = 'XEQUE!';
        document.body.appendChild(checkOverlayTop);

        const checkOverlayBottom = document.createElement('div');
        checkOverlayBottom.className = 'check-overlay bottom';
        checkOverlayBottom.innerText = 'XEQUE!';
        document.body.appendChild(checkOverlayBottom);

        // Position check overlays dynamically based on board position
        function positionCheckOverlays() {
            const boardRect = boardEl.getBoundingClientRect();
            const squareSize = boardEl.clientHeight / 8;
            
            // Position checkOverlayTop at rank 7 (row 1)
            const topRow = 1;
            const topY = boardRect.top + topRow * squareSize + squareSize / 2 - checkOverlayTop.offsetHeight / 2;
            checkOverlayTop.style.top = topY + 'px';
            
            // Position both overlays centered horizontally
            const centerX = boardRect.left + boardRect.width / 2 - checkOverlayTop.offsetWidth / 2;
            checkOverlayTop.style.left = centerX + 'px';
            
            // Position checkOverlayBottom at rank 2 (row 6)
            const bottomRow = 6;
            const bottomY = boardRect.top + bottomRow * squareSize + squareSize / 2 - checkOverlayBottom.offsetHeight / 2;
            checkOverlayBottom.style.top = bottomY + 'px';
            
            const centerX2 = boardRect.left + boardRect.width / 2 - checkOverlayBottom.offsetWidth / 2;
            checkOverlayBottom.style.left = centerX2 + 'px';
        }
        
        // Position overlays after creation
        positionCheckOverlays();
        
        // Reposition on window resize
        window.addEventListener('resize', positionCheckOverlays);

        const resultModal = document.createElement('div');
        resultModal.id = 'result-modal';
        resultModal.innerHTML = `<h2 id="result-text"></h2><button onclick="restartGame()">OK</button>`;
        document.body.appendChild(resultModal);

        let selectedSquare = null;
        let validMoves = [];
        let pendingPromotionMove = null; // Variável para segurar a jogada enquanto escolhe a peça
        let mode = '1v1'; // 'bot' ou '1v1'
        let aiColor = 'b'; // bot joga com pretas por padrão
        const aiDepth = 3; // profundidade padrão da IA
        let selectedTime = null;
        let timeType = 'sandbox';
        let whiteTime = null;
        let blackTime = null;
        let activeClock = null;
        let clockInterval = null;
        let gameFinished = false;
        let currentPieceSkin = 'classic';
        let currentBoardSkin = 'classic';

        const pieceSkins = {
            classic: {
                w: {'p': '♙', 'n': '♘', 'b': '♗', 'r': '♖', 'q': '♕', 'k': '♔'},
                b: {'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚'}
            },
            simple: {
                w: {'p': 'P', 'n': 'N', 'b': 'B', 'r': 'R', 'q': 'Q', 'k': 'K'},
                b: {'p': 'p', 'n': 'n', 'b': 'b', 'r': 'r', 'q': 'q', 'k': 'k'}
            },
            fancy: {
                w: {'p': '♙', 'n': '♘', 'b': '♗', 'r': '♖', 'q': '♕', 'k': '♔'},
                b: {'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚'}
            },
            solid: {
                // Use the filled (black) glyphs for both colors, and rely on CSS color
                // to display white pieces as filled white (avoids outline-only white glyphs)
                w: {'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚'},
                b: {'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚'}
            }
        };

        const boardSkins = {
            classic: 'board-skin-classic',
            ice: 'board-skin-ice',
            wood: 'board-skin-wood',
            night: 'board-skin-night'
        };

        const timeOptions = {
            bullet: 180,
            blitz: 300,
            normal: 600,
            beginner: 900,
            sandbox: null
        };

        const piecesMap = {
            'w': {'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚'},
            'b': {'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚'}
        };

        function chooseMode(selected) {
            if (selected === '1v1') {
                mode = '1v1';
            } else {
                mode = 'bot';
                aiColor = selected === 'bot-w' ? 'w' : 'b';
            }
            modeModal.style.display = 'none';
            updateBoard();
            startClock();

            if (mode === 'bot' && game.turn() === aiColor && !game.game_over()) {
                setTimeout(() => makeAIMove(), 300);
            }
        }

        function chooseTime(selected) {
            selectedTime = selected;
            timeType = selected;
            whiteTime = timeOptions[selected];
            blackTime = timeOptions[selected];
            timeModal.style.display = 'none';
            modeModal.style.display = 'flex';
            updateTimerDisplay();
        }

        function formatTime(seconds) {
            if (seconds === null) return '∞';
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function updateTimerDisplay() {
            const whiteText = whiteTime === null ? '∞' : formatTime(whiteTime);
            const blackText = blackTime === null ? '∞' : formatTime(blackTime);
            timerEl.innerText = `Brancas: ${whiteText}  |  Pretas: ${blackText}`;
            if (whiteSideTimerEl) whiteSideTimerEl.innerText = whiteText;
            if (blackSideTimerEl) blackSideTimerEl.innerText = blackText;
        }

        function startClock() {
            if (clockInterval) return;
            activeClock = game.turn();
            updateTimerDisplay();
            if (timeType === 'sandbox') return;

            clockInterval = setInterval(() => {
                if (gameFinished || game.game_over()) {
                    clearInterval(clockInterval);
                    clockInterval = null;
                    return;
                }
                if (!activeClock) return;
                if (activeClock === 'w' && whiteTime !== null) {
                    whiteTime -= 1;
                }
                if (activeClock === 'b' && blackTime !== null) {
                    blackTime -= 1;
                }
                updateTimerDisplay();

                if ((activeClock === 'w' && whiteTime <= 0) || (activeClock === 'b' && blackTime <= 0)) {
                    clearInterval(clockInterval);
                    clockInterval = null;
                    endByTime(activeClock);
                }
            }, 1000);
        }

        function switchClock() {
            activeClock = game.turn();
            updateTimerDisplay();
        }

        function endByTime(color) {
            gameFinished = true;
            const loser = color === 'w' ? 'Brancas' : 'Pretas';
            const winner = color === 'w' ? 'Pretas' : 'Brancas';
            showResultModal(`Tempo esgotado! ${winner} vence.`);
        }

        function setPieceSkin(skin) {
            currentPieceSkin = skin;
            updateBoard();
            document.querySelectorAll('#pieces-skin-options .skin-option').forEach(option => {
                option.classList.toggle('selected', option.dataset.skin === skin);
            });
        }

        function setBoardSkin(skin) {
            boardEl.classList.remove(...Object.values(boardSkins));
            boardEl.classList.add(boardSkins[skin]);
            currentBoardSkin = skin;
            document.querySelectorAll('#board-skin-options .skin-option').forEach(option => {
                option.classList.toggle('selected', option.dataset.skin === skin);
            });
        }

        function setupSkinControls() {
            document.querySelectorAll('.skin-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.skin-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const target = tab.dataset.tab;
                    document.getElementById('pieces-skin-options').classList.toggle('hidden', target !== 'pieces');
                    document.getElementById('board-skin-options').classList.toggle('hidden', target !== 'board');
                });
            });

            document.querySelectorAll('#pieces-skin-options .skin-option').forEach(option => {
                option.addEventListener('click', () => setPieceSkin(option.dataset.skin));
            });
            document.querySelectorAll('#board-skin-options .skin-option').forEach(option => {
                option.addEventListener('click', () => setBoardSkin(option.dataset.skin));
            });
        }

        function createBoard() {
            boardEl.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const squareId = String.fromCharCode('a'.charCodeAt(0) + col) + (8 - row);
                    
                    const squareEl = document.createElement('div');
                    squareEl.classList.add('square');
                    squareEl.classList.add((row + col) % 2 === 0 ? 'light' : 'dark');
                    squareEl.id = squareId;
                    
                    squareEl.addEventListener('click', () => handleSquareClick(squareId));
                    
                    boardEl.appendChild(squareEl);
                }
            }
            updateBoard();
        }

        function handleSquareClick(squareId) {
            // Se o jogo acabou, se acabou o tempo ou se está esperando escolher a promoção, ignora cliques no tabuleiro
            if (game.game_over() || pendingPromotionMove || gameFinished) return;

            const piece = game.get(squareId);
            // Procura o movimento válido para a casa clicada
            const isMove = validMoves.find(m => m.to === squareId);

            if (selectedSquare && isMove) {
                // Intercepta se for uma jogada de promoção (a biblioteca usa a flag 'p' para promotion)
                if (isMove.flags && isMove.flags.includes('p')) {
                    pendingPromotionMove = { from: selectedSquare, to: squareId };
                    
                    // Pinta temporariamente os botões da cor de quem está jogando
                    const turnColor = game.turn();
                    document.querySelectorAll('.promo-btn').forEach(btn => {
                        btn.className = `promo-btn ${turnColor === 'w' ? 'piece-white' : 'piece-black'}`;
                        btn.style.backgroundColor = turnColor === 'w' ? '#333' : '#fff'; // Ajusta fundo para dar contraste
                    });

                    // Mostra o modal
                    promotionModal.style.display = 'block';
                    return; 
                }

                // Jogada normal (não promoção)
                game.move({ from: selectedSquare, to: squareId });
                selectedSquare = null;
                validMoves = [];
                updateBoard();

                // Se modo for contra bot e agora é vez do bot, dispara a jogada do bot
                if (mode === 'bot' && game.turn() === aiColor && !game.game_over()) {
                    setTimeout(() => makeAIMove(), 300);
                }

                return;
            }

            if (piece && piece.color === game.turn()) {
                selectedSquare = squareId;
                validMoves = game.moves({ square: squareId, verbose: true });
                updateBoard();
            } 
            else {
                selectedSquare = null;
                validMoves = [];
                updateBoard();
            }
        }

        // Função chamada pelos botões do menu de promoção
        function promotePiece(pieceType) {
            if (pendingPromotionMove) {
                // Executa a jogada informando a peça escolhida (q, r, b ou n)
                game.move({
                    from: pendingPromotionMove.from,
                    to: pendingPromotionMove.to,
                    promotion: pieceType
                });
                
                // Reseta variáveis e esconde o menu
                pendingPromotionMove = null;
                promotionModal.style.display = 'none';
                selectedSquare = null;
                validMoves = [];
                
                updateBoard();

                // Se modo for bot e agora for vez do bot, ele joga
                if (mode === 'bot' && game.turn() === aiColor && !game.game_over()) {
                    setTimeout(() => makeAIMove(), 300);
                }
            }
        }

        function updateBoard() {
            document.querySelectorAll('.square').forEach(sq => {
                sq.innerText = '';
                sq.classList.remove('selected', 'highlight', 'highlight-capture', 'piece-white', 'piece-black', 'piece-skin-classic', 'piece-skin-fancy', 'piece-skin-solid');
                
                const squareId = sq.id;
                const piece = game.get(squareId);
                
                if (piece) {
                    // Render pieces using the currently selected (allowed) skin
                    sq.innerText = pieceSkins[currentPieceSkin][piece.color][piece.type];
                    sq.classList.add(piece.color === 'w' ? 'piece-white' : 'piece-black');
                    // apply skin class: fancy / solid / classic
                    if (currentPieceSkin === 'fancy') sq.classList.add('piece-skin-fancy');
                    else if (currentPieceSkin === 'solid') sq.classList.add('piece-skin-solid');
                    else sq.classList.add('piece-skin-classic');
                }

                if (squareId === selectedSquare) {
                    sq.classList.add('selected');
                }

                const move = validMoves.find(m => m.to === squareId);
                if (move) {
                    if (game.get(squareId)) {
                        sq.classList.add('highlight-capture'); 
                    } else {
                        sq.classList.add('highlight'); 
                    }
                }
            });

            updateStatus();
            if (timeType !== 'sandbox' && !gameFinished) {
                switchClock();
            }
            updateCapturedPieces();
        }

        function updateStatus() {
            let status = '';
            let moveColor = game.turn() === 'w' ? 'Brancas' : 'Pretas';

            statusEl.classList.remove('check-alert');

            if (game.in_checkmate()) {
                status = `Jogo acabou! As ${moveColor} estão em XEQUE-MATE.`;
                statusEl.classList.add('check-alert');
                if (typeof checkOverlayTop !== 'undefined') { checkOverlayTop.style.display = 'none'; checkOverlayTop.classList.remove('flash'); }
                if (typeof checkOverlayBottom !== 'undefined') { checkOverlayBottom.style.display = 'none'; checkOverlayBottom.classList.remove('flash'); }
                showResultModal(`Xeque-Mate! As ${game.turn() === 'w' ? 'Pretas' : 'Brancas'} venceram!`);
            } 
            else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
                status = 'Jogo acabou! EMPATE.';
                if (typeof checkOverlayTop !== 'undefined') { checkOverlayTop.style.display = 'none'; checkOverlayTop.classList.remove('flash'); }
                if (typeof checkOverlayBottom !== 'undefined') { checkOverlayBottom.style.display = 'none'; checkOverlayBottom.classList.remove('flash'); }
                showResultModal('Empate!');
            } 
            else {
                status = `Vez das ${moveColor}`;
                if (game.in_check()) {
                    status += ' (XEQUE!)';
                    statusEl.classList.add('check-alert');
                    // Mostra overlay superior para XEQUE nas pretas, inferior para XEQUE nas brancas
                    if (game.turn() === 'b') {
                        if (typeof checkOverlayTop !== 'undefined') { checkOverlayTop.style.display = 'block'; checkOverlayTop.classList.add('flash'); }
                        if (typeof checkOverlayBottom !== 'undefined') { checkOverlayBottom.style.display = 'none'; checkOverlayBottom.classList.remove('flash'); }
                    } else {
                        if (typeof checkOverlayBottom !== 'undefined') { checkOverlayBottom.style.display = 'block'; checkOverlayBottom.classList.add('flash'); }
                        if (typeof checkOverlayTop !== 'undefined') { checkOverlayTop.style.display = 'none'; checkOverlayTop.classList.remove('flash'); }
                    }
                } else {
                    if (typeof checkOverlayTop !== 'undefined') { checkOverlayTop.style.display = 'none'; checkOverlayTop.classList.remove('flash'); }
                    if (typeof checkOverlayBottom !== 'undefined') { checkOverlayBottom.style.display = 'none'; checkOverlayBottom.classList.remove('flash'); }
                }
            }

            statusEl.innerText = status;
        }

        function updateCapturedPieces() {
            const whiteCapturedList = document.getElementById('captured-white-list');
            const blackCapturedList = document.getElementById('captured-black-list');
            whiteCapturedList.innerHTML = '';
            blackCapturedList.innerHTML = '';

            const history = game.history({ verbose: true });
            const whiteCaptured = [];
            const blackCaptured = [];

            for (const move of history) {
                if (move.captured) {
                    const symbol = pieceSkins[currentPieceSkin][move.color === 'w' ? 'b' : 'w'][move.captured];
                    if (move.color === 'w') {
                        blackCaptured.push(symbol);
                    } else {
                        whiteCaptured.push(symbol);
                    }
                }
            }

            whiteCaptured.forEach(piece => {
                const pieceEl = document.createElement('div');
                pieceEl.className = 'captured-piece piece-white';
                if (currentPieceSkin === 'fancy') pieceEl.classList.add('piece-skin-fancy');
                else if (currentPieceSkin === 'solid') pieceEl.classList.add('piece-skin-solid');
                else pieceEl.classList.add('piece-skin-classic');
                pieceEl.innerText = piece;
                whiteCapturedList.appendChild(pieceEl);
            });
            blackCaptured.forEach(piece => {
                const pieceEl = document.createElement('div');
                pieceEl.className = 'captured-piece piece-black';
                if (currentPieceSkin === 'fancy') pieceEl.classList.add('piece-skin-fancy');
                else if (currentPieceSkin === 'solid') pieceEl.classList.add('piece-skin-solid');
                else pieceEl.classList.add('piece-skin-classic');
                pieceEl.innerText = piece;
                blackCapturedList.appendChild(pieceEl);
            });
        }

        function showResultModal(text) {
            gameFinished = true;
            if (clockInterval) {
                clearInterval(clockInterval);
                clockInterval = null;
            }
            document.getElementById('result-text').innerText = text;
            resultModal.style.display = 'block';
        }

        function restartGame() {
            window.location.reload();
        }

// 1. Avaliação do tabuleiro ajustada para Xeque-Mate
function evaluateBoard(board) {
    if (board.in_checkmate()) {
        // Se está em xeque-mate, o jogador do turno atual perdeu
        return board.turn() === 'w' ? -9999 : 9999;
    }
    if (board.in_draw() || board.in_stalemate()) {
        return 0; // Empates valem zero
    }

    const values = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };
    let total = 0;

    for (let sq of board.SQUARES) {
        const piece = board.get(sq);
        if (piece) {
            const val = values[piece.type] || 0;
            total += (piece.color === 'w') ? val : -val;
        }
    }
    return total;
}

// 2. Minimax otimizado usando board.undo()
function minimax(board, depth, alpha, beta, isMaximizing) {
    if (depth === 0 || board.game_over()) {
        return evaluateBoard(board);
    }

    const moves = board.moves({ verbose: true });

    if (isMaximizing) {
        let maxEval = -Infinity;
        for (let m of moves) {
            const promotionParam = (m.flags && m.flags.includes('p')) ? 'q' : undefined;
            board.move({ from: m.from, to: m.to, promotion: promotionParam });

            const evalScore = minimax(board, depth - 1, alpha, beta, false);
            
            board.undo(); // Desfaz a jogada no mesmo tabuleiro (muito mais rápido)

            maxEval = Math.max(maxEval, evalScore);
            alpha = Math.max(alpha, evalScore);
            if (beta <= alpha) break;
        }
        return maxEval;
    } else {
        let minEval = Infinity;
        for (let m of moves) {
            const promotionParam = (m.flags && m.flags.includes('p')) ? 'q' : undefined;
            board.move({ from: m.from, to: m.to, promotion: promotionParam });

            const evalScore = minimax(board, depth - 1, alpha, beta, true);
            
            board.undo(); // Desfaz a jogada

            minEval = Math.min(minEval, evalScore);
            beta = Math.min(beta, evalScore);
            if (beta <= alpha) break;
        }
        return minEval;
    }
    }

// 3. Seleção da melhor jogada adaptada para Brancas ou Pretas
function getBestMove(board, depth) {
    const moves = board.moves({ verbose: true });
    let bestMove = null;
    const isMaximizing = (board.turn() === 'w');
    let bestValue = isMaximizing ? -Infinity : Infinity;

    for (let m of moves) {
        const promotionParam = (m.flags && m.flags.includes('p')) ? 'q' : undefined;
        board.move({ from: m.from, to: m.to, promotion: promotionParam });

        const moveValue = minimax(board, depth - 1, -Infinity, Infinity, !isMaximizing);
        
        board.undo();

        if (isMaximizing) {
            if (moveValue > bestValue) {
                bestValue = moveValue;
                bestMove = m;
            }
        } else {
            if (moveValue < bestValue) {
                bestValue = moveValue;
                bestMove = m;
            }
        }
    }
    return bestMove;
    }

function makeAIMove() {
    if (game.game_over()) return;

    const best = getBestMove(game, aiDepth);
    if (!best) return;

    const promotionParam = (best.flags && best.flags.includes('p')) ? 'q' : undefined;
    game.move({ from: best.from, to: best.to, promotion: promotionParam });

    updateBoard();
    }
        // Inicialização
        createBoard();
        setupSkinControls();
        setBoardSkin('classic');
        setPieceSkin('classic');
